# PostgreSQL for the context layer and the decision log, the Python API, and the TypeScript UI.
services:
  db:
    image: postgres:17-alpine
    environment: { POSTGRES_USER: postgres, POSTGRES_PASSWORD: postgres, POSTGRES_DB: secondplant }
    ports: ['5435:5432']
    healthcheck: { test: ['CMD-SHELL', 'pg_isready -U postgres -d secondplant'], interval: 3s, retries: 20 }
  api:
    build: .
    environment: { DATABASE_URL: 'postgresql://postgres:postgres@db:5432/secondplant' }
    depends_on: { db: { condition: service_healthy } }
    command: sh -c "python -m core.seed && uvicorn api.main:app --host 0.0.0.0 --port 8000"
    ports: ['8011:8000']
  web:
    image: node:22-alpine
    working_dir: /web
    volumes: ['./web:/web']
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0 --port 5175"
    environment: { API_URL: 'http://api:8000' }
    ports: ['5175:5175']
    depends_on: [api]
